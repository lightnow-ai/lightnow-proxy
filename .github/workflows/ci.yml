name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  risk:
    name: Classify compatibility risk
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.profile.outputs.matrix }}
      risk: ${{ steps.profile.outputs.risk }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: profile
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: python ci/risk_profile.py "$BASE_SHA" "$HEAD_SHA" "$EVENT_NAME" >> "$GITHUB_OUTPUT"

  test:
    name: Python ${{ matrix.python-version }}
    needs: risk
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.risk.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Lint
        run: uv run --extra dev ruff check src tests examples

      - name: Test
        run: uv run --extra dev python -m pytest -q -p ci.pytest_inventory --junitxml=test-reports/junit.xml -o junit_family=xunit1 --alluredir=test-reports/allure-results

      - name: Verify complete native testcase inventory
        if: always()
        run: python ci/verify_test_inventory.py

      - name: Set up Allure runtime
        if: always()
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: Verify release lineage selection
        if: always()
        run: node --test ci/test-release-reuse.cjs

      - name: Native Allure quality gate
        if: always()
        run: npx --yes allure@3.33.0 generate test-reports/allure-results --config ci/allurerc.mjs

      - name: Pack original native results
        if: always()
        run: |
          npx --yes allure@3.33.0 results pack test-reports/allure-results --name test-reports/allure-results.zip
          if [ -d test-reports/allure-report ]; then
            python -m zipfile -c test-reports/allure-report.zip test-reports/allure-report
          fi

      - name: Upload compressed native test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: source-tests-python-${{ matrix.python-version }}
          compression-level: 0
          path: |
            test-reports/*.zip
            test-reports/junit.xml
            test-reports/planned-pytest.json
          if-no-files-found: error

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build and check distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Verify distribution provenance contract
        run: python -m unittest discover -s ci -p 'test_*.py'

      - name: Bind PR distribution provenance
        if: github.event_name == 'pull_request'
        env:
          ARTIFACT_REPOSITORY: ${{ github.repository }}
          ARTIFACT_PR_NUMBER: ${{ github.event.pull_request.number }}
          ARTIFACT_HEAD_REVISION: ${{ github.event.pull_request.head.sha }}
          ARTIFACT_RUN_ID: ${{ github.run_id }}
          ARTIFACT_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python ci/create_client_artifact.py --component proxy \
            --repository "$ARTIFACT_REPOSITORY" \
            --pr-number "$ARTIFACT_PR_NUMBER" \
            --head-revision "$ARTIFACT_HEAD_REVISION" \
            --run-id "$ARTIFACT_RUN_ID" \
            --run-attempt "$ARTIFACT_RUN_ATTEMPT"

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
