name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Lint
        run: uv run --extra dev ruff check src tests examples

      - name: Test
        run: uv run --extra dev pytest -q

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build and check distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Verify distribution provenance contract
        run: python -m unittest discover -s ci -p 'test_*.py'

      - name: Bind PR distribution provenance
        if: github.event_name == 'pull_request'
        env:
          ARTIFACT_REPOSITORY: ${{ github.repository }}
          ARTIFACT_PR_NUMBER: ${{ github.event.pull_request.number }}
          ARTIFACT_HEAD_REVISION: ${{ github.event.pull_request.head.sha }}
          ARTIFACT_RUN_ID: ${{ github.run_id }}
          ARTIFACT_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python ci/create_client_artifact.py --component proxy \
            --repository "$ARTIFACT_REPOSITORY" \
            --pr-number "$ARTIFACT_PR_NUMBER" \
            --head-revision "$ARTIFACT_HEAD_REVISION" \
            --run-id "$ARTIFACT_RUN_ID" \
            --run-attempt "$ARTIFACT_RUN_ATTEMPT"

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
